<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* UNIVERSAL-SELECTOR - applies to everyting on the page*/
        * {
            font-size:16px;
        }
        /* ELEMENT SELECTORS */
        body {
            background-color : red;
        }
        h1 {
            color:blue
        }
        h2 {
            color : pink ;
        }
        p {color : green;
        }
        /* CLASS SELECTOR */
        .about {
            color:aquamarine;
            font-weight: bold;
        }
        /* ID SELECTOR */
        #choices {
            background-color:bisque;
        }
        h2,p {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>My colorful card</h1>
    <!--"Inline CSS":"add style="color:___;"inside this p tag-->
    <p style="color:yellow;">hi!this is my web section</p>
    <div id="choices">
        <h2>about my favourite</h2>
        <p class="about">my name is ramesh</p>
        <p class="about">my favourite hobby is drawing</p>

    </div>

    <h2>my choices</h2>
    <p>My favourite bird is penguin</p>
    <p>My favourite country is japan</p>


</body>
</html>
